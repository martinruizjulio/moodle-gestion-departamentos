name: HEE maintenance C2
on:
  push:
    paths:
      - '.github/workflows/hee-maintenance-c2.yml'
permissions:
  contents: write
jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,t): Path(p).write_text(t,encoding='utf-8')
          def replace_function(path, signature, replacement):
              text=read(path); start=text.find(signature)
              if start<0: raise SystemExit(f'{path}: function not found: {signature}')
              brace=text.find('{',start)
              depth=0; end=None; in_s=in_d=False; esc=False
              for i in range(brace,len(text)):
                  c=text[i]
                  if esc: esc=False; continue
                  if c=='\\': esc=True; continue
                  if not in_d and c=="'": in_s=not in_s; continue
                  if not in_s and c=='"': in_d=not in_d; continue
                  if in_s or in_d: continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end is None: raise SystemExit(f'{path}: unmatched function braces')
              write(path,text[:start]+replacement+text[end:])
          def exact(path,old,new,count=1):
              text=read(path); n=text.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count}, got {n}: {old[:90]}')
              write(path,text.replace(old,new,count))
          def commit(msg,paths):
              subprocess.run(['git','add',*paths],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode:
                  subprocess.run(['git','commit','-m',msg],check=True)

