name: Validate local 1.5.135

on:
  push:
    paths:
      - '.github/workflows/validate-1.5.135.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l gestion_actividades/classes/local/manager.php
          php -l gestion_actividades/classes/local/bulk_workshops.php
          php -l gestion_actividades/edition_edit.php
