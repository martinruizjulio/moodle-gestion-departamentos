name: Temporary package Moodle plugins

on:
  push:
    paths:
      - '.github/workflows/package-moodle-plugins.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIPs
        run: |
          zip -qr local_gestion_actividades.zip gestion_actividades
          zip -qr block_gestion_hee.zip gestion_hee
      - name: Upload local plugin
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades
          path: local_gestion_actividades.zip
          if-no-files-found: error
      - name: Upload block plugin
        uses: actions/upload-artifact@v4
        with:
          name: block_gestion_hee
          path: block_gestion_hee.zip
          if-no-files-found: error
