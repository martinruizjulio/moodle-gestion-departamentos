name: Temporary orphan cleanup validate

on:
  push:
    paths:
      - '.github/workflows/temp-orphan-cleanup.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l gestion_actividades/classes/local/manager.php
          php -l gestion_actividades/test_cleanup.php
      - name: Package local
        run: |
          zip -qr local_gestion_actividades_1.5.126-alpha.zip gestion_actividades
      - name: Upload local
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades_1.5.126-alpha
          path: local_gestion_actividades_1.5.126-alpha.zip
