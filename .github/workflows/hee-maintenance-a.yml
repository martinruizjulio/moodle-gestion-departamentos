          import re, subprocess
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,t): Path(p).write_text(t,encoding='utf-8')
          def exact(p,o,n,c=1):
              t=read(p); a=t.count(o)
              if a!=c: raise SystemExit(f'{p}: expected {c}, got {a}: {o[:80]}')
              write(p,t.replace(o,n,c))
          def regex(p,pat,repl,c=1):
              t=read(p); ntext,n=re.subn(pat,lambda m: repl,t,count=c,flags=re.S)
              if n!=c: raise SystemExit(f'{p}: regex expected {c}, got {n}: {pat[:80]}')
              write(p,ntext)
          def commit(msg,paths):
              subprocess.run(['git','add',*paths],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode:
                  subprocess.run(['git','commit','-m',msg],check=True)

