name: Temporary package local 1.5.128

on:
  push:
    paths:
      - '.github/workflows/temp-package-128.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package local plugin
        run: |
          zip -qr local_gestion_actividades_1.5.128-alpha.zip gestion_actividades
      - name: Upload local plugin
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades_1.5.128-alpha
          path: local_gestion_actividades_1.5.128-alpha.zip
