name: Temporary package local 1.5.129

on:
  push:
    paths:
      - '.github/workflows/temp-package-129.yml'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l gestion_actividades/classes/local/manager.php
          php -l gestion_actividades/classes/local/bulk_workshops.php
          php -l gestion_actividades/classes/local/workshop_series.php
          php -l gestion_actividades/dashboard.php
          php -l gestion_actividades/workshop_view.php
          php -l gestion_actividades/unenrol.php
          php -l gestion_actividades/card_status.php
          php -l gestion_actividades/lib.php
      - name: JavaScript syntax
        run: |
          node --check gestion_actividades/amd/src/card_status.js
          node --check gestion_actividades/amd/src/card_status_v2.js
          node --check gestion_actividades/amd/build/card_status.min.js
          node --check gestion_actividades/amd/build/card_status_v2.min.js
      - name: Package
        run: |
          zip -qr local_gestion_actividades_1.5.129-alpha.zip gestion_actividades
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades_1.5.129-alpha
          path: local_gestion_actividades_1.5.129-alpha.zip
