name: Temporary terminology check

on:
  push:
    paths:
      - '.github/workflows/temp-terminology-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Seminario terminology
        run: |
          echo "Occurrences:"
          grep -RniE 'seminario|seminarios' gestion_actividades gestion_hee docs || true
