name: Temporary PHP syntax check

on:
  push:
    paths:
      - '.github/workflows/temp-php-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l gestion_actividades/classes/local/manager.php
          php -l gestion_actividades/classes/local/workshop_series.php
          php -l gestion_actividades/classes/local/course_layout.php
          php -l gestion_actividades/workshop_series.php
          php -l gestion_actividades/enrol.php
