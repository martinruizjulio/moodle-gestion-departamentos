name: Temporary deletion cleanup check

on:
  push:
    paths:
      - '.github/workflows/temp-deletion-cleanup-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l gestion_actividades/classes/local/manager.php
          php -l gestion_actividades/classes/local/workshop_series.php
