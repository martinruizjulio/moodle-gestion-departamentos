name: HEE final source audit

on:
  push:
    paths:
      - '.github/workflows/hee-final-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Finish Bootstrap 5 select classes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          for root in [Path('gestion_actividades'), Path('gestion_hee')]:
              for path in root.rglob('*.php'):
                  old = path.read_text(encoding='utf-8')
                  lines = []
                  for line in old.splitlines(True):
                      if "start_tag('select'" in line and 'form-control' in line:
                          line = line.replace('form-control', 'form-select')
                      lines.append(line)
                  new = ''.join(lines)
                  if new != old:
                      path.write_text(new, encoding='utf-8')
          PY

      - name: Validate all PHP and XML
        shell: bash
        run: |
          set -euo pipefail
          find gestion_actividades gestion_hee -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/hee-php-lint.log
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('.').glob('**/*.xml'):
              if '.git' not in path.parts:
                  ET.parse(path)
          print('PHP syntax and XML well-formedness: OK')
          PY

      - name: Reviewer-oriented source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('gestion_actividades'), Path('gestion_hee')]

          ddl = re.compile(r'->\s*(?:create_table|add_field|add_index|drop_table|drop_field|drop_index)\s*\(')
          ddl_hits = []
          for path in Path('gestion_actividades').rglob('*.php'):
              if path.as_posix() == 'gestion_actividades/db/upgrade.php':
                  continue
              if ddl.search(path.read_text(encoding='utf-8')):
                  ddl_hits.append(str(path))
          if ddl_hits:
              raise SystemExit('Runtime DDL remains outside db/upgrade.php: ' + ', '.join(ddl_hits))

          manual_auth = re.compile(r"['\"]auth['\"]\s*=>\s*['\"]manual['\"]", re.I)
          auth_hits = [str(p) for p in Path('gestion_actividades').rglob('*.php') if manual_auth.search(p.read_text(encoding='utf-8'))]
          if auth_hits:
              raise SystemExit('Manual Moodle account creation remains: ' + ', '.join(auth_hits))

          if '$_FILES' in Path('gestion_actividades/typeb_upload.php').read_text(encoding='utf-8'):
              raise SystemExit('Type B upload still uses raw $_FILES')

          legacy_tokens = ['badge-success', 'badge-warning', 'badge-danger', 'badge-secondary', 'float-right', 'btn-block', 'form-inline']
          margin_re = re.compile(r'(?<![A-Za-z0-9_-])(?:mr|ml)-[0-9]+(?![A-Za-z0-9_-])')
          legacy_hits = []
          select_hits = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.css', '.mustache', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if any(token in text for token in legacy_tokens) or margin_re.search(text):
                      legacy_hits.append(str(path))
                  if path.suffix.lower() == '.php':
                      for line in text.splitlines():
                          if "start_tag('select'" in line and 'form-control' in line:
                              select_hits.append(str(path))
          if legacy_hits:
              raise SystemExit('Bootstrap 4 classes remain: ' + ', '.join(sorted(set(legacy_hits))))
          if select_hits:
              raise SystemExit('Selects still use form-control: ' + ', '.join(sorted(set(select_hits))))

          events = Path('gestion_hee/db/events.php').read_text(encoding='utf-8')
          if r'\core\event\file_created' in events or r'\core\event\file_deleted' in events:
              raise SystemExit('Invalid block file observers remain')
          if Path('gestion_hee/classes/observer.php').exists():
              raise SystemExit('Obsolete block observer class still exists')

          privacy = Path('gestion_actividades/classes/privacy/provider.php').read_text(encoding='utf-8')
          for required in ['request_provider', 'core_userlist_provider', 'export_user_data', 'get_users_in_context', 'delete_data_for_user']:
              if required not in privacy:
                  raise SystemExit('Privacy provider missing: ' + required)

          upload = Path('gestion_actividades/typeb_upload.php').read_text(encoding='utf-8')
          uploadform = Path('gestion_actividades/classes/form/typeb_upload_form.php').read_text(encoding='utf-8')
          if 'typeb_upload_form' not in upload or "addElement('filepicker'" not in uploadform:
              raise SystemExit('Type B external upload is not using moodleform/filepicker')

          for path in ['gestion_actividades/export.php', 'gestion_actividades/gradehistory.php']:
              if 'can_manage_globally' not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(path + ' is not restricted to global HEE managers')

          access = Path('gestion_actividades/db/access.php').read_text(encoding='utf-8')
          if 'RISK_PERSONAL' not in access or 'RISK_CONFIG' not in access:
              raise SystemExit('Capability risk bitmasks are incomplete')

          manager = Path('gestion_actividades/classes/local/manager.php').read_text(encoding='utf-8')
          teacher = Path('gestion_actividades/teacher_view.php').read_text(encoding='utf-8')
          if 'quizgradingmode' not in manager or 'get_user_grade_for_cmid' not in manager or 'cuestionario' not in manager.lower():
              raise SystemExit('Type A quiz certificate eligibility is incomplete')
          if 'Cuestionario del taller' not in teacher:
              raise SystemExit('Teacher view is not quiz-aware')

          workshopview = Path('gestion_actividades/workshop_view.php').read_text(encoding='utf-8')
          if "optional_param('editionid'" not in workshopview or 'can_manage_edition' not in workshopview:
              raise SystemExit('Student workshop view is not bound to a concrete edition')

          install = Path('gestion_actividades/db/install.xml').read_text(encoding='utf-8')
          upgrade = Path('gestion_actividades/db/upgrade.php').read_text(encoding='utf-8')
          if 'NAME="seriesid"' not in install or '2026100513' not in upgrade:
              raise SystemExit('Explicit edition-series schema link is missing')

          grade = Path('gestion_actividades/classes/local/grade_manager.php').read_text(encoding='utf-8')
          if 'typeb_reflection_activity::submission_summary' not in grade:
              raise SystemExit('Type B canonical Moodle reflection state is not used in grade manager')

          print('Reviewer-oriented source assertions: OK')
          PY

      - name: Publish audited cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hee-final-audit.yml
          git add -A
          git commit -m "chore: finish HEE reviewer-oriented cleanup"
          git push origin HEAD:main
