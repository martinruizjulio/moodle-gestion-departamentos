name: Temporary final validate and package

on:
  push:
    paths:
      - '.github/workflows/temp-final-package.yml'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find gestion_actividades gestion_hee -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify Taller terminology
        run: |
          if grep -RniE 'seminario|seminarios' gestion_actividades gestion_hee docs; then
            echo "Legacy terminology found"
            exit 1
          fi
      - name: XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          for p in pathlib.Path('.').rglob('*.xml'):
              ET.parse(p)
          print('XML OK')
          PY
      - name: Package
        run: |
          mkdir -p dist
          zip -qr dist/local_gestion_actividades_1.5.125-alpha.zip gestion_actividades
          zip -qr dist/block_gestion_hee_1.0.26-alpha.zip gestion_hee
      - name: Upload local
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades_1.5.125-alpha
          path: dist/local_gestion_actividades_1.5.125-alpha.zip
      - name: Upload block
        uses: actions/upload-artifact@v4
        with:
          name: block_gestion_hee_1.0.26-alpha
          path: dist/block_gestion_hee_1.0.26-alpha.zip
