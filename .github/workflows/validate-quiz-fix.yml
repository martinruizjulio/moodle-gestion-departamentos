name: Validate quiz fix

on:
  push:
    paths:
      - '.github/workflows/validate-quiz-fix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax manager
        run: php -l gestion_actividades/classes/local/manager.php
      - name: PHP syntax import
        run: php -l gestion_actividades/classes/local/bulk_workshops.php
      - name: PHP syntax manual
        run: php -l gestion_actividades/edition_edit.php
