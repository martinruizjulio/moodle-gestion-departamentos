name: Package local 1.5.134

on:
  push:
    paths:
      - '.github/workflows/package-1.5.134.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: find gestion_actividades -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package plugin
        run: zip -qr local_gestion_actividades_1.5.134-alpha.zip gestion_actividades
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_gestion_actividades_1.5.134-alpha
          path: local_gestion_actividades_1.5.134-alpha.zip
