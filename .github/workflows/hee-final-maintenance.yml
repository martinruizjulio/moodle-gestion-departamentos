name: HEE final maintenance

on:
  push:
    paths:
      - 'tools/hee_maintenance_final.py'
      - '.github/workflows/hee-final-maintenance.yml'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply maintenance
        run: python3 tools/hee_maintenance_final.py
      - name: Validate PHP and XML
        run: |
          set -euo pipefail
          find gestion_actividades gestion_hee -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('.').glob('**/*.xml'):
              if '.git' not in path.parts:
                  ET.parse(path)
          PY
      - name: Remove temporary maintenance files
        run: |
          rm -f tools/hee_maintenance_final.py .github/workflows/hee-final-maintenance.yml
          git add -A
          git commit -m "chore: remove temporary HEE maintenance files"
          git push origin HEAD:main
